  <rect x="35" y="655" width="260" height="90" class="actor"/>
  <text x="165" y="700" class="label">Accessibility Reviewer</text>

  <rect x="600" y="105" width="260" height="65" rx="8" class="usecase"/>
  <text x="730" y="137" class="label">Manage Dataset</text>

  <rect x="540" y="230" width="350" height="65" rx="8" class="usecase"/>
  <text x="715" y="262" class="label">Run K-Means Clustering</text>

  <rect x="590" y="355" width="280" height="65" rx="8" class="usecase"/>
  <text x="730" y="387" class="label">View Trend Analysis</text>

  <rect x="475" y="480" width="510" height="75" rx="8" class="usecase"/>
  <text x="730" y="517" class="label">Get WCAG Color Recommendation</text>

  <rect x="555" y="635" width="360" height="65" rx="8" class="usecase"/>
  <text x="735" y="667" class="label">Run Website Accessibility Audit</text>

  <path d="M245 130 L600 137" class="line" marker-end="url(#arrow)"/>
  <path d="M245 310 L600 137" class="line" marker-end="url(#arrow)"/>
  <path d="M245 310 L540 262" class="line" marker-end="url(#arrow)"/>
  <path d="M245 310 L590 387" class="line" marker-end="url(#arrow)"/>
  <path d="M245 310 L475 517" class="line" marker-end="url(#arrow)"/>
  <path d="M245 510 L590 387" class="line" marker-end="url(#arrow)"/>
  <path d="M245 510 L475 517" class="line" marker-end="url(#arrow)"/>
  <path d="M295 700 L475 517" class="line" marker-end="url(#arrow)"/>
  <path d="M295 700 L555 667" class="line" marker-end="url(#arrow)"/>
