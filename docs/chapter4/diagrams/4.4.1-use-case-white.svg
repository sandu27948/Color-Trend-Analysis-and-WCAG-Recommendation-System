<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <style>
    .line { stroke: #000000; stroke-width: 3; fill: none; }
    .actor { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .usecase { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .label { fill: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 20px; text-anchor: middle; dominant-baseline: middle; }
    .title { fill: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="330" y="30" width="820" height="750" class="usecase"/>
  <text x="740" y="65" class="title">Color Trend Analysis and WCAG Recommendation System</text>

  <rect x="55" y="95" width="190" height="70" class="actor"/>
